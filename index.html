<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>อัปโหลดไฟล์</title>
  <script>
    async function uploadFiles() {
      const files = document.getElementById("fileInput").files;
      const form = new FormData();

      // ตรวจสอบว่ามีไฟล์ที่เลือกหรือไม่
      if (files.length === 0) {
        alert("กรุณาเลือกไฟล์ก่อน");
        return;
      }

      // เพิ่มไฟล์ใน formData
      for (let file of files) {
        form.append("files[]", file);
      }

      try {
        // ส่งข้อมูลไปยัง Google Apps Script
        const res = await fetch("https://script.google.com/macros/s/AKfycbzf06Ldum2x8mm4FbvTidZCc8oNz9Gn7yq2nkKv4GzC33rxiNesvgdl85SBaQSejAHX/exec", {
          method: "POST",
          body: form,
        });

        const json = await res.json();  // รับข้อมูล JSON จาก Google Apps Script
        console.log(json);
        alert("อัปโหลดสำเร็จ!");
      } catch (error) {
        console.error("เกิดข้อผิดพลาด: ", error);
        alert("การอัปโหลดไฟล์ล้มเหลว");
      }
    }
  </script>
</head>
<body class="p-4 font-sans">
  <h1>📁 อัปโหลดไฟล์ (หลายไฟล์)</h1>
  <input type="file" id="fileInput" multiple />
  <button onclick="uploadFiles()">อัปโหลด</button>
</body>
</html>
